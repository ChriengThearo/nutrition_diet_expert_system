{% extends "layouts/base.html" %}
{% block title %}Delete Permission{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0">Confirm Delete</h5>
            </div>
            <div class="card-body">
                <p class="text-break">
                    Are you sure you want to delete permission
                    <strong>{{ permission.code }}</strong>({{ permission.name }})?
                </p>

                <form method="post">
                    {{ form.hidden_tag() }}

                    <div class="d-grid gap-2 d-sm-flex">
                        <button type="submit" class="btn btn-danger py-2">
                            Delete
                        </button>
                        <a href="{{ url_for('tbl_permissions.detail', permission_id=permission.id) }}"
                        class="btn btn-secondary py-2">
                        Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
