[project]
name = "nutrition-diet-expert-system"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.0",
    "sqlalchemy>=2.0.0",
    "flask-wtf>=1.2.1",
    "wtforms>=3.1.2",
    "email-validator>=2.1.0",
    "flask-login>=0.6.3",
    "flask-migrate>=4.0.5",
    "python-dotenv",
    "psycopg[binary]",
    "requests",
    "Pillow>=11,<12",
    "torch>=2.7,<3",
    "transformers>=4.52,<6"
]

[tool.vercel]
entrypoint = "run:app"
